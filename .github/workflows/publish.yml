name: Validate CUBARESORT.CA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # ignore-scripts=false so Prisma's postinstall generates the client.
      - run: npm ci --ignore-scripts=false
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:6543/postgres?schema=cubaresort
          DIRECT_URL: postgresql://ci:ci@localhost:5432/postgres?schema=cubaresort
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build the Coolify image
        run: docker build -t cubaresort-ca:ci .
