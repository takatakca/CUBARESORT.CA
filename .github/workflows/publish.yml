name: Validate and publish CUBARESORT.CA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubaresort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Static checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and run tests
        run: npm run validate
      - name: Prepare static release
        run: npm run build
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubaresort-static
          path: dist/
          if-no-files-found: error
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: cubaresort-static
          path: dist/
      - id: configure
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the exact public HTTPS release
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm run verify:live -- --url "$LIVE_URL" --sha "$EXPECTED_SHA"; then
              echo "### Published and verified CUBARESORT.CA" >> "$GITHUB_STEP_SUMMARY"
              echo "$LIVE_URL — commit $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public release did not match the tested commit or its assets failed."
          exit 1
